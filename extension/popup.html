<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>쿠팡매니저 자동 리뷰어</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
    }
    body {
      width: 320px;
      padding: 16px;
      background: #f9fafb;
      color: #111827;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e5e7eb;
    }
    .title {
      font-size: 15px;
      font-weight: 800;
      color: #6d28d9;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 9999px;
      background: #dcfce7;
      color: #15803d;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #374151;
      margin-bottom: 6px;
    }
    .desc {
      font-size: 11px;
      color: #6b7280;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    input[type="text"], select {
      width: 100%;
      padding: 8px 10px;
      font-size: 12px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      outline: none;
      background: #fff;
    }
    input[type="text"]:focus, select:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.15);
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 8px;
    }
    .chip {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #e5e7eb;
      cursor: pointer;
      font-weight: 600;
    }
    .chip:hover {
      background: #ede9fe;
      color: #6d28d9;
      border-color: #c4b5fd;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 10px;
      font-size: 12px;
      color: #374151;
      font-weight: 600;
      cursor: pointer;
    }
    .btn {
      width: 100%;
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary {
      background: #7c3aed;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #6d28d9;
    }
    .btn-secondary {
      margin-top: 6px;
      background: #f3f4f6;
      color: #4b5563;
      border: 1px solid #e5e7eb;
    }
    .btn-secondary:hover {
      background: #e5e7eb;
    }
    .status-msg {
      margin-top: 8px;
      font-size: 11px;
      text-align: center;
      color: #16a34a;
      font-weight: 700;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">🚀 쿠팡매니저 자동 리뷰</div>
    <span class="badge">동작 대기 중</span>
  </div>

  <div class="card">
    <label for="assignedAccount">이 크롬 창의 담당 계정주</label>
    <p class="desc">
      비워두면 쿠팡 화면의 로그인 이름(예: 김*연)으로 자동 매칭하며, 이름을 지정하면 해당 계정주 작업만 실행합니다.
    </p>
    <input type="text" id="assignedAccount" placeholder="예: 김수연 (비워두면 자동 감지)" />
    <div class="chips" id="accountChips">
      <button type="button" class="chip" data-name="">자동감지</button>
      <button type="button" class="chip" data-name="김수연">김수연</button>
      <button type="button" class="chip" data-name="이시온">이시온</button>
      <button type="button" class="chip" data-name="정덕현">정덕현</button>
      <button type="button" class="chip" data-name="김양희">김양희</button>
      <button type="button" class="chip" data-name="이현숙">이현숙</button>
    </div>
  </div>

  <div class="card">
    <label for="folderName">캡처 이미지 저장 하위 폴더 (다운로드 폴더 내)</label>
    <input type="text" id="folderName" value="쿠팡리뷰인증" placeholder="쿠팡리뷰인증" />

    <label class="checkbox-row">
      <input type="checkbox" id="includeAccountPrefix" checked />
      <span>파일명 앞에 [계정주] 붙이기</span>
    </label>
    <p class="desc" style="margin-top:4px; margin-bottom:0;">
      체크 시: <code>[김수연] 상품명.png</code> / 해제 시: <code>상품명.png</code>
    </p>
  </div>

  <button type="button" id="saveBtn" class="btn btn-primary">설정 저장하기</button>
  <button type="button" id="resetTaskBtn" class="btn btn-secondary">진행 중 작업 강제 초기화</button>
  <div id="statusMsg" class="status-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
